[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lockkeeper"
version = "1.1.2"
description = "npm for your agent's context: cross-runtime capability routing with a built-in prompt-injection firewall."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Himanshu", email = "173780478+Hannay001@users.noreply.github.com" }]
maintainers = [{ name = "Himanshu", email = "173780478+Hannay001@users.noreply.github.com" }]
keywords = ["agents", "skills", "mcp", "prompt-injection", "security", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/Hannay001/lockkeeper"
Issues = "https://github.com/Hannay001/lockkeeper/issues"
Roadmap = "https://github.com/Hannay001/lockkeeper/blob/main/ROADMAP.md"

[project.scripts]
lockkeeper = "capability_registry:main"
capability-registry = "capability_registry:main"  # legacy alias
cap = "capability_registry:main"  # deprecated alias
lockkeeper-audit = "cap_audit:main"
lockkeeper-hook = "cap_audit:main_hook"

[tool.setuptools]
package-dir = { "" = "scripts", "lockkeeper_embedder" = "embedder" }
py-modules = ["capability_registry", "router_config", "cap_audit", "cap_setup"]
packages = ["lockkeeper_embedder"]
