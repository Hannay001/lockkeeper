[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lockkeeper"
version = "1.3.0"
description = "Skill router and prompt-injection firewall for AI coding agents: give Claude Code, Codex and Cursor the right skills, MCP servers and tools for each task."
readme = "README.md"
requires-python = ">=3.11"
license = "FSL-1.1-ALv2"
authors = [{ name = "Himanshu", email = "173780478+Hannay001@users.noreply.github.com" }]
maintainers = [{ name = "Himanshu", email = "173780478+Hannay001@users.noreply.github.com" }]
keywords = [
    "ai-agents", "agent-skills", "skills", "skill-md", "claude-code", "codex", "cursor", "mcp",
    "model-context-protocol", "mcp-server", "context-window", "llm", "router", "prompt-injection",
    "security", "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/Hannay001/lockkeeper"
Issues = "https://github.com/Hannay001/lockkeeper/issues"
Documentation = "https://github.com/Hannay001/lockkeeper#documentation"
Benchmark = "https://github.com/Hannay001/lockkeeper/blob/main/docs/BENCHMARK.md"
Changelog = "https://github.com/Hannay001/lockkeeper/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/Hannay001/lockkeeper/blob/main/ROADMAP.md"

[project.scripts]
lockkeeper = "capability_registry:main"
capability-registry = "capability_registry:main"  # legacy alias
cap = "capability_registry:main"  # deprecated alias
lockkeeper-audit = "cap_audit:main"
lockkeeper-hook = "cap_audit:main_hook"

[tool.setuptools]
package-dir = { "" = "scripts", "lockkeeper_embedder" = "embedder", "lockkeeper_decision" = "decision" }
py-modules = ["capability_registry", "router_config", "cap_audit", "cap_setup", "decision_provider", "telemetry", "mcp_server", "route_hook", "library"]
packages = ["lockkeeper_embedder", "lockkeeper_decision"]
